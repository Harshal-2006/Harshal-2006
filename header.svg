<svg width="100%" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="60%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="wave1grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="wave2grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d47a1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#64B5F6;stop-opacity:0.15"/>
    </linearGradient>
    <style>
      .wave1 { animation: moveWave1 6s ease-in-out infinite alternate; }
      .wave2 { animation: moveWave2 8s ease-in-out infinite alternate; }
      .title { animation: fadeIn 1.2s ease-out forwards; opacity: 0; }
      .subtitle { animation: fadeIn 1.2s ease-out 0.5s forwards; opacity: 0; }
      @keyframes moveWave1 {
        0%   { d: path("M0,120 C150,80 300,150 450,110 C600,70 750,140 900,100 L900,180 L0,180 Z"); }
        100% { d: path("M0,100 C150,140 300,70 450,120 C600,160 750,80 900,130 L900,180 L0,180 Z"); }
      }
      @keyframes moveWave2 {
        0%   { d: path("M0,140 C200,100 400,160 600,120 C750,90 850,145 900,130 L900,180 L0,180 Z"); }
        100% { d: path("M0,130 C200,160 400,100 600,150 C750,170 850,115 900,140 L900,180 L0,180 Z"); }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="180" fill="url(#bg)"/>

  <!-- Waves -->
  <path class="wave2" fill="url(#wave2grad)" d="M0,140 C200,100 400,160 600,120 C750,90 850,145 900,130 L900,180 L0,180 Z"/>
  <path class="wave1" fill="url(#wave1grad)" d="M0,120 C150,80 300,150 450,110 C600,70 750,140 900,100 L900,180 L0,180 Z"/>

  <!-- Text -->
  <text class="title" x="50%" y="80" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700"
    fill="#e2e8f0" letter-spacing="2">
    Harshal Shirsat
  </text>
  <text class="subtitle" x="50%" y="118" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400"
    fill="#64B5F6" letter-spacing="1">
    Computer Engineering · AI &amp; ML Enthusiast
  </text>
</svg>
